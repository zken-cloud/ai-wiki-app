# =============================================================================
# ai-wiki source configuration
#
# THIS FILE IS THE EXTENSION POINT.
#   * New source of an existing type  -> add an entry under `sources:`
#   * Brand-new category              -> copy a block under `categories:`
#   * New source *type*               -> add a function to pipeline/collect.py
#
# Every feed URL below was verified live (HTTP 200 + parseable) before being
# committed. Anthropic and vLLM publish no RSS feed, so they use `sitemap`.
# =============================================================================

defaults:
  # How far back a source may reach. Undated items are always kept.
  # 7 days, not 3: several high-value publishers (NCSC, Google Security,
  # Meta Engineering, Google AI) post weekly or slower, and a 3-day window
  # returned zero items from them. The seen-ledger makes a wide window safe —
  # nothing is ever published twice.
  window_days: 7
  # Region is set by GCP_LOCATION (default: global).
  # One model for every stage, by choice: simpler to reason about and to bill.
  # Note this puts triage on Flash rather than Flash-Lite — triage is the
  # highest-volume call in the pipeline (it sees every item, not just the
  # survivors), so that is where the cost sits. Set `score` back to
  # gemini-2.5-flash-lite if bulk triage cost ever matters more than uniformity.
  # NOTE: gemini-3.6-pro and gemini-3.6-flash-lite do not exist — verified 404
  # on Vertex — so 3.6-flash is the only 3.6 tier available.
  models:
    score: gemini-3.6-flash        # bulk relevance triage
    summarize: gemini-3.6-flash    # per-item summaries
    digest: gemini-3.6-flash       # one cross-category daily digest
    signal: gemini-3.6-flash       # picks the day's top items for the front page
  concurrency: 6

# =============================================================================
# Benchmark Arena — leaderboard snapshots (state, not stream).
# Each board reads the same structured file its own site renders client-side,
# which is far more stable than scraping the rendered page.
# =============================================================================
benchmarks:
  # Coding. SWE-bench (Verified 229d, bash-only 156d) and Aider Polyglot (302d)
  # were removed as out of date — see git history to restore them. SWE-rebench
  # regenerates its tasks from new PRs, so it stays within days of frontier
  # releases and also covers Go/Java/Rust, which SWE-bench does not.
  - id: swe-rebench
    group: 💻 Coding
    title: SWE-rebench
    blurb: >-
      Continuously refreshed SWE-bench-style tasks drawn from new pull requests,
      so it is contamination-resistant and tracks frontier models within days.
      Covers Python, Go, Java and Rust; reports cost per instance.
    parser: swe_rebench
    url: https://swe-rebench.com/
    source_url: https://swe-rebench.com/
    language: all
    top: 15

  - id: cybergym
    group: 🛡️ Cybersecurity
    title: CyberGym
    blurb: Real-world vulnerability discovery by AI agents (level 1).
    parser: cybergym
    url: https://cybergym.io/assets/data/cybergym.json
    source_url: https://cybergym.io/cybergym/
    level: level1
    top: 12

  - id: cybergym-e2e
    group: 🛡️ Cybersecurity
    title: CyberGym End-to-End
    blurb: Patch-and-exploit success under a fixed time and cost budget.
    parser: cybergym_e2e
    url: https://cybergym.io/assets/data/cybergym-e2e.json
    source_url: https://cybergym.io/cybergym-e2e/
    top: 12

  - id: exploitgym
    group: 🛡️ Cybersecurity
    title: ExploitGym
    blurb: Exploit-development capability on real userspace targets.
    parser: exploitgym
    url: https://cybergym.io/assets/data/exploitgym.json
    source_url: https://cybergym.io/exploitgym/
    top: 12

categories:

  # ---------------------------------------------------------------- papers --
  - id: papers
    title: Research Papers
    blurb: New arXiv papers, triaged for relevance and summarised to key points.
    icon: "\U0001F4C4"
    sources:
      # Tier 1: community-curated. Upvotes are a free relevance signal.
      - type: hf_daily
        limit: 40
      # Tier 2: recall — catches what did not trend on HF.
      # cs.CR lives under `security`, not here: it is the only reliable daily
      # source of AI-security content, and that category was averaging 0.3
      # items/day without it. One home per paper — the dedupe ledger is keyed
      # on uid globally, so listing it in both would be ambiguous.
      - type: arxiv
        categories: [cs.AI, cs.LG, cs.CL]
        max_results_per_category: 60
    filter:
      # Curated (HF-upvoted) items bypass LLM scoring entirely — saves tokens.
      always_keep_curated: true
      # 3, not 4: the threshold was tuned against gemini-2.5-flash-lite, and
      # 3.6-flash grades this rubric about one point stricter on the same items
      # (measured: on an identical 30-paper pool, lite scored 21 at >=4 where
      # 3.6-flash scored 17 at >=4 and 23 at >=3). Keeping 4 was an accidental
      # tightening, not a deliberate one.
      min_score: 3
      max_items: 25
      # Without this quota the curated tier (pinned to score 5) eats all 25
      # slots and the arXiv recall tier never appears. 15/10 split.
      max_curated: 15
      keywords:
        - language model
        - LLM
        - transformer
        - agent
        - reasoning
        - alignment
        - fine-tun
        - RLHF
        - inference
        - benchmark
        - multimodal
        - retrieval
        - diffusion
        - attention
        - prompt
        - safety
        - jailbreak
        - adversarial
        - quantiz
        - distill
        - evaluation
    criteria: >
      Substantive AI/ML research: new methods, models, training or inference
      techniques, evaluations, or security findings relevant to modern language
      models and AI systems. Down-rank incremental domain applications with no
      transferable method contribution.

  # -------------------------------------------------------------- security --
  - id: security
    title: AI Security
    blurb: Threats, vulnerabilities, and defensive research affecting AI systems.
    icon: "\U0001F512"
    sources:
      - type: rss
        limit_per_feed: 25
        feeds:
          # AI-security specialists — highest signal for this category.
          - name: Embrace The Red
            url: https://embracethered.com/blog/index.xml
          - name: NVIDIA AI Security
            url: https://developer.nvidia.com/blog/category/cybersecurity/feed/
          # Vendor + national security research (keyword/LLM filtered for AI relevance).
          - name: Google Online Security Blog
            url: https://security.googleblog.com/atom.xml
          - name: Microsoft Security Blog
            url: https://www.microsoft.com/en-us/security/blog/feed/
          # NOTE: NCSC UK (ncsc.gov.uk/api/1/services/v1/report-rss-feed.xml)
          # was removed. The feed still returns 200 and parses, but its newest
          # entry is 454 days old — it was costing a fetch every run for
          # content that never arrives. Google Online Security (103d) and
          # Project Zero (83d) are kept despite being slow: they do still post,
          # and when they do it is high signal.
          - name: Trail of Bits
            url: https://blog.trailofbits.com/feed/
          - name: Unit 42
            url: https://unit42.paloaltonetworks.com/feed/
          - name: Google Project Zero
            url: https://googleprojectzero.blogspot.com/feeds/posts/default
          # Added after this category averaged 0.3 items/day over its first
          # month: five of the feeds above are general-security blogs that
          # rarely touch AI, so the filter was correctly discarding almost
          # everything collected. All verified live before committing.
          - name: Adversa AI
            url: https://adversa.ai/feed/
          - name: Schneier on Security
            url: https://www.schneier.com/feed/atom/
          - name: OWASP GenAI Security
            url: https://genai.owasp.org/feed/
          - name: Cloud Security Alliance
            url: https://cloudsecurityalliance.org/blog/feed
      # The workhorse: arXiv cs.CR is the one source that reliably carries
      # AI-security material every single day. Moved here from `papers`.
      - type: arxiv
        categories: [cs.CR]
        max_results_per_category: 60
          # NOTE: CISA (cisa.gov/cybersecurity-advisories/all.xml) is deliberately
          # omitted. Its WAF 403s any non-browser User-Agent, and its content is
          # overwhelmingly ICS/OT advisories with no AI dimension. Not worth
          # spoofing a browser for.
    filter:
      # 3, and only safe because of max_arxiv below: with papers capped
      # independently, a lower bar can admit more news but never more papers,
      # and news slots that go unfilled fall back to papers anyway.
      #
      # Do not expect much from it. Measured on 2026-08-04 against the 15
      # ledger-fresh news items: scores were {1:11, 2:2, 4:1, 5:1} — nothing
      # sat at 3, so this threshold change admitted zero extra items that day.
      # The constraint is supply, not the bar: 11 of 15 genuinely-new news
      # items were Microsoft monthly roundups, non-AI malware writeups and
      # vendor press releases, and the two that mattered already cleared 4.
      # The lever that would actually help is better AI-security sources.
      min_score: 3
      max_items: 15
      # At most 10 of the 15 slots may go to arXiv, holding 5 for actual news.
      # Without this the category ran 83% papers. Unused news slots fall back
      # to papers, so a quiet news day still fills the page.
      max_arxiv: 10
      keywords:
        - AI
        - LLM
        - machine learning
        - model
        - prompt injection
        - jailbreak
        - agent
        - MCP
        - deepfake
        - data poisoning
        - supply chain
        - inference
        - GPU
    criteria: >
      Security news OR research that touches AI/ML systems: attacks on or via
      models, prompt injection, agent and tool-use abuse, model supply-chain
      issues, AI-assisted threat activity, or defensive guidance for AI
      deployments. arXiv cs.CR papers count when the contribution is about
      AI/ML systems.
      EXCLUDE generic CVEs and ICS advisories with no AI dimension, and
      classical cryptography or network-security work with no AI component.

  # ----------------------------------------------------------------- infra --
  - id: infra
    title: AI Infrastructure
    blurb: Serving, training, hardware, and the systems layer underneath AI.
    icon: "⚙️"
    sources:
      - type: rss
        limit_per_feed: 25
        feeds:
          - name: NVIDIA Developer Blog
            url: https://developer.nvidia.com/blog/feed
          - name: NVIDIA Blog
            url: https://blogs.nvidia.com/feed/
          - name: PyTorch Blog
            url: https://pytorch.org/blog/feed.xml
          - name: AWS Machine Learning Blog
            url: https://aws.amazon.com/blogs/machine-learning/feed/
          - name: Google Cloud Blog
            url: https://cloudblog.withgoogle.com/rss/
          - name: Meta Engineering
            url: https://engineering.fb.com/feed/
      - type: sitemap
        sites:
          - name: vLLM Blog
            url: https://blog.vllm.ai/sitemap.xml
            path_contains: /20
            max_pages: 6
    filter:
      # 3 for the same reason as papers: the threshold was set against
      # 2.5-flash-lite, and 3.6-flash grades about a point stricter. At 4 this
      # category kept 1 item from 13; at 3 it keeps 5, and the four at 3 are
      # real infra content (Nemotron 3 Ultra, NeMo Guardrails self-hosting,
      # task-aware knowledge compression). Security stays at 4 — it clears 22
      # items at that bar now, so it does not need the help.
      min_score: 3
      max_items: 15
      keywords:
        - GPU
        - CUDA
        - inference
        - serving
        - training
        - cluster
        - kernel
        - throughput
        - latency
        - quantization
        - distributed
        - vLLM
        - TensorRT
        - accelerator
        - memory
        - scaling
        - datacenter
        # Added after an audit: the prefilter was cutting 35 items to 6 and
        # dropping real content before the model ever saw it — including a
        # Google Cloud post literally titled "What's new in AI infrastructure
        # and orchestration". None of the terms above match that.
        - infrastructure
        - orchestration
        - compute
        - TPU
        - deploy
        - runtime
        - efficiency
        - Kubernetes
    criteria: >
      Technical AI-infrastructure content: inference serving, training systems,
      accelerators and kernels, distributed scaling, performance optimisation,
      or platform releases that change how AI workloads are run.
      EXCLUDE consumer/gaming content and pure marketing announcements.

  # --------------------------------------------------------------- vendors --
  - id: vendors
    title: Lab & Vendor News
    blurb: Announcements and engineering writing from the major AI labs.
    icon: "\U0001F4E2"
    sources:
      # Anthropic publishes NO RSS feed — sitemap.xml is the reliable route.
      - type: sitemap
        sites:
          - name: Anthropic
            url: https://www.anthropic.com/sitemap.xml
            path_contains: /news/
            max_pages: 12
      - type: rss
        limit_per_feed: 25
        feeds:
          - name: OpenAI
            url: https://openai.com/news/rss.xml
          - name: Google AI
            url: https://blog.google/technology/ai/rss/
          - name: Google DeepMind
            url: https://deepmind.google/blog/rss.xml
          - name: Hugging Face
            url: https://huggingface.co/blog/feed.xml
          - name: Simon Willison
            url: https://simonwillison.net/atom/everything/
    filter:
      min_score: 3          # lower bar: vendor announcements are inherently notable
      max_items: 20
      keywords: []          # no prefilter — these sources are already on-topic
    criteria: >
      Announcements, research writing, product and model releases, or safety
      and policy positions from major AI labs and platforms.
      Down-rank pure marketing, event promos, and hiring posts.
